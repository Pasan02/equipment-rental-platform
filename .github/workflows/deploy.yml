name: Continuous Deployment (Docker Hub & Remote Cloud Server)

on:
  push:
    branches: [ main, master ]

env:
  DOCKERHUB_REPO_API: ${{ secrets.DOCKERHUB_USERNAME }}/equipment-rental-api
  DOCKERHUB_REPO_WEB: ${{ secrets.DOCKERHUB_USERNAME }}/equipment-rental-web

jobs:
  build-and-push:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO_API }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract Metadata (Tags, Labels) for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO_WEB }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  deploy:
    name: Deploy to Cloud Environment (AWS/Azure/GCP/VPS)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Cloud Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/equipment-rental-platform || mkdir -p /opt/equipment-rental-platform && cd /opt/equipment-rental-platform
            
            # Export Docker Hub username
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # Pull latest images from Docker Hub
            docker compose -f docker-compose.prod.yml pull
            
            # Launch/Update production containers
            docker compose -f docker-compose.prod.yml up -d
            
            # Run Prisma DB Migrations inside running API container
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy
            
            # Clean up dangling images
            docker image prune -f
